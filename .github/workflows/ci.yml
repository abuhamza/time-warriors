name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build
        run: ./gradlew build

      - name: Test
        run: ./gradlew test

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    strategy:
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            ext: dmg
          - os: ubuntu-latest
            task: packageDeb
            ext: deb
          - os: windows-latest
            task: packageMsi
            ext: msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Package
        run: ./gradlew ${{ matrix.task }}

      - name: Find package
        id: pkg
        run: |
          PKG_PATH=$(find build/compose/binaries -name '*.${{ matrix.ext }}' | head -1)
          echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.ext }}
          path: ${{ steps.pkg.outputs.PKG_PATH }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        id: assets
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p release-assets

          DMG=$(find artifacts -name '*.dmg' | head -1)
          DEB=$(find artifacts -name '*.deb' | head -1)
          MSI=$(find artifacts -name '*.msi' | head -1)

          cp "$DMG" "release-assets/TimewGUI-${VERSION}.dmg"
          cp "$DEB" "release-assets/TimewGUI-${VERSION}.deb"
          cp "$MSI" "release-assets/TimewGUI-${VERSION}.msi"

          echo "DMG_SHA=$(shasum -a 256 "release-assets/TimewGUI-${VERSION}.dmg" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            --title "TimewGUI ${{ steps.version.outputs.VERSION }}" \
            --generate-notes

      - name: Update Homebrew Cask
        run: |
          sed -i '' "s/version \".*\"/version \"${{ steps.version.outputs.VERSION }}\"/" Casks/timewgui.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${{ steps.assets.outputs.DMG_SHA }}\"/" Casks/timewgui.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/timewgui.rb
          git commit -m "Update Homebrew Cask to v${{ steps.version.outputs.VERSION }}" || true
          git push origin HEAD:main || true
