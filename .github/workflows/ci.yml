name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build
        run: ./gradlew build

      - name: Test
        run: ./gradlew test

  release:
    runs-on: macos-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Package DMG
        run: ./gradlew packageDmg

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Find DMG
        id: dmg
        run: |
          DMG_PATH=$(find build/compose/binaries -name '*.dmg' | head -1)
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "DMG_NAME=TimewGUI-${{ steps.version.outputs.VERSION }}.dmg" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        id: sha
        run: echo "SHA256=$(shasum -a 256 ${{ steps.dmg.outputs.DMG_PATH }} | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.dmg.outputs.DMG_PATH }}" "${{ steps.dmg.outputs.DMG_NAME }}"
          gh release create "${{ github.ref_name }}" \
            "${{ steps.dmg.outputs.DMG_NAME }}" \
            --title "TimewGUI ${{ steps.version.outputs.VERSION }}" \
            --generate-notes

      - name: Update Homebrew Cask
        run: |
          sed -i '' "s/version \".*\"/version \"${{ steps.version.outputs.VERSION }}\"/" Casks/timewgui.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${{ steps.sha.outputs.SHA256 }}\"/" Casks/timewgui.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/timewgui.rb
          git commit -m "Update Homebrew Cask to v${{ steps.version.outputs.VERSION }}" || true
          git push origin HEAD:main || true
