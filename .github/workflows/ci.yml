name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build
        run: ./gradlew build

      - name: Test
        run: ./gradlew test

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    strategy:
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            ext: dmg
          - os: ubuntu-22.04
            task: packageDeb
            ext: deb
          - os: windows-latest
            task: packageMsi
            ext: msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Package
        run: ./gradlew ${{ matrix.task }} -PappVersion=${GITHUB_REF_NAME#v}

      - name: Find package
        id: pkg
        run: |
          PKG_PATH=$(find build/compose/binaries -name '*.${{ matrix.ext }}' | head -1)
          echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.ext }}
          path: ${{ steps.pkg.outputs.PKG_PATH }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        id: assets
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p release-assets

          DMG=$(find artifacts -name '*.dmg' | head -1)
          DEB=$(find artifacts -name '*.deb' | head -1)
          MSI=$(find artifacts -name '*.msi' | head -1)

          cp "$DMG" "release-assets/TimewGUI-${VERSION}.dmg"
          cp "$DEB" "release-assets/TimewGUI-${VERSION}.deb"
          cp "$MSI" "release-assets/TimewGUI-${VERSION}.msi"

          echo "DMG_SHA=$(shasum -a 256 "release-assets/TimewGUI-${VERSION}.dmg" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" &>/dev/null; then
            echo "Release already exists — uploading assets to it"
            gh release upload "${{ github.ref_name }}" release-assets/* --clobber
          else
            gh release create "${{ github.ref_name }}" \
              release-assets/* \
              --title "TimewGUI ${{ steps.version.outputs.VERSION }}" \
              --generate-notes
          fi

      - name: Update Homebrew Cask
        run: |
          sed -i '' "s/version \".*\"/version \"${{ steps.version.outputs.VERSION }}\"/" Casks/timewgui.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${{ steps.assets.outputs.DMG_SHA }}\"/" Casks/timewgui.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/timewgui.rb
          git commit -m "Update Homebrew Cask to v${{ steps.version.outputs.VERSION }}" || true
          git push origin HEAD:main || true

  publish-apt:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download .deb from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          gh release download "v${VERSION}" \
            --pattern "TimewGUI-${VERSION}.deb" \
            --dir /tmp

      - name: Repack .deb with timewarrior dependency
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          DEB="/tmp/TimewGUI-${VERSION}.deb"

          # Extract
          EXTRACT_DIR=$(mktemp -d)
          dpkg-deb -R "$DEB" "$EXTRACT_DIR"

          # Inject Depends: timewarrior
          if grep -q '^Depends:' "$EXTRACT_DIR/DEBIAN/control"; then
            sed -i 's/^Depends:.*/&, timewarrior/' "$EXTRACT_DIR/DEBIAN/control"
          else
            echo "Depends: timewarrior" >> "$EXTRACT_DIR/DEBIAN/control"
          fi

          # Repack
          dpkg-deb --build "$EXTRACT_DIR" "$DEB"

      - name: Add .deb to pool
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p pool/main/t/timewgui
          cp "/tmp/TimewGUI-${VERSION}.deb" "pool/main/t/timewgui/"

      - name: Generate APT metadata
        run: |
          # Generate Packages index
          dpkg-scanpackages --multiversion pool/ > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          # Generate Release file with proper Suite/Codename
          cd dists/stable
          apt-ftparchive release \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            . > Release

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Sign Release file
        run: |
          cd dists/stable
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
          gpg --batch --yes --armor --clearsign -o InRelease Release

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update APT repo for v${{ steps.version.outputs.VERSION }}" || echo "No changes to commit"
          git push origin gh-pages
